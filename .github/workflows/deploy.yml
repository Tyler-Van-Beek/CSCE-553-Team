name: Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIYA_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.PRIYA_AZURE_VM_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy application
        run: |
          ssh ubuntu@${{ secrets.PRIYA_AZURE_VM_IP }} << 'EOF'
            set -e

            echo "Moving to repository..."
            cd /var/www/myapp

            echo "Getting latest main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "Activating virtual environment..."
            source /var/www/myapp/.venv/bin/activate

            echo "Installing dependencies..."
            pip install -r /var/www/myapp/lagniappe_signup/requirements.txt

            echo "Running Django deployment steps..."
            cd /var/www/myapp/lagniappe_signup
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            echo "Restarting Gunicorn..."
            sudo systemctl restart gunicorn

            echo "Reloading Nginx..."
            sudo systemctl reload nginx

            echo "Deployment completed."
          EOF